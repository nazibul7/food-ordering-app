global:
  scrape_interval: 10s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "food-ordering-app-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]

  - job_name: "mongodb"
    static_configs:
      - targets: ["mongo-exporter:9216"]

  - job_name: "host"
    static_configs:
      - targets: ["node-exporter:9100"]
